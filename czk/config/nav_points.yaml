# =============================================================================
# 底盘导航点配置
# =============================================================================
# 重要说明:
#   - 这里的"点位编号"是 SLAM 地图中预录制的地图点索引 (通过 HMI 录制)
#   - 本文件只配置"按什么顺序访问哪些点位"
#   - 点位的实际 xy 坐标存在 SLAM 服务的地图数据中, 不在本文件中
#   - 录制新点位必须通过 HMI 在机器人现场操作
# =============================================================================

# ── 取货流水线导航序列 ────────────────────────────────────────────────
# 起点 → 取货点 → (取货纠偏) → 中转点
# 现场录制后填写实际点位编号
pick_pipeline:
  to_pick: [0, 1]      # TODO: 起点到取货点的导航序列
  from_pick: [2, 0]    # TODO: 取货完成后到中转点的序列

# ── 放货流水线导航序列 ────────────────────────────────────────────────
# 中转点 → 放货点 → (放货纠偏) → 终点
place_pipeline:
  to_place: [0, 3]     # TODO: 中转点到放货点的序列
  from_place: [4, 0]   # TODO: 放货完成后到终点的序列

# ── 单场景纠偏时的导航点 ──────────────────────────────────────────────
# main.py --scene pick --nav-to 1 时使用
single_scene:
  pick: 1              # 取货纠偏点位编号
  place: 3             # 放货纠偏点位编号

# ── 导航通用参数 ──────────────────────────────────────────────────────
pause: 2.0             # 到达每个点后停留时间 (秒)
nav_timeout: 120       # 导航超时 (秒, GO 命令含路径规划)
skip_fail: false       # 某点失败是否继续 (false=遇错即停)

# ── pipeline 人工衔接停顿 ────────────────────────────────────────────
# B 模式: 纠偏完成后等待人工操作 (取货/放货动作), 按回车继续
manual_hook:
  pick_done_msg: "取货纠偏完成, 请手动执行取货动作. 完成后按回车继续..."
  place_done_msg: "放货纠偏完成, 请手动执行放货动作. 完成后按回车继续..."
